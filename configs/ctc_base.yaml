# AETHER STT v0.1 — phase 1 joint-objective base experiment config.
# Every field here has a dataclass default in src/aether_v3/config.py;
# this file exists so it's easy to see/edit without reading the code.

mimi:
  pretrained_id: kyutai/mimi
  sampling_rate: 24000
  num_quantizers: 1 # semantic codebook only (index 0 of 32)

aether_speech:
  semantic_vocab_size: 2048
  hidden_size: 768
  num_layers: 8
  num_heads: 12
  ffn_size: 3072
  dropout: 0.1
  rope_theta: 10000.0
  max_position_embeddings: 4096
  streaming_left_context_frames: 256 # ~20.5s at Mimi q0's 12.5Hz

ctc:
  vocab_size: 257 # 256 UTF-8 byte values + 1 blank
  blank_id: 256
  # 12.5Hz Mimi frames are below typical English byte-rate (~12-18
  # bytes/sec) - measured on the real train cache, only ~15.7% of
  # examples survived the CTC-feasibility filter at raw 12.5Hz, and even
  # those sat right at the alignment ceiling (p95 required/available
  # frame ratio ~1.0). upsample_factor=4 (-> 50Hz for the CTC branch only,
  # AetherSpeechEncoder's own 12.5Hz output is untouched) gives enough
  # headroom that nearly all examples become feasible again.
  upsample_factor: 4
  upsampler_num_layers: 2
  upsampler_num_heads: 12
  upsampler_ffn_size: 3072
  upsampler_dropout: 0.1
  upsampler_rope_theta: 10000.0

semantic_prediction:
  enabled: true
  weight: 0.25
  future_horizons: [1, 2, 4]

data:
  backend: hf_parquet
  dataset_id: manifestro/stage1_aether
  dataset_revision: 4bb733b62abd021c4a153ff5196682912933588e
  train_split: train
  validation_split: validation
  test_split: test # reserved for final evaluation; training never opens it
  cache_dir: data_cache/stage1_aether
  max_semantic_frames_per_batch: 16384
  length_bucket_size: 512

train:
  runs_dir: runs
  run_name: stage1
  run_id: null
  batch_size: 32
  grad_accum_steps: 1
  max_steps: 200000
  warmup_steps: 2000
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.98
  grad_clip_norm: 1.0
  eval_interval: 2000
  save_interval: 2000
  log_interval: 50
  num_workers: 4
  seed: 1337
  amp_dtype: bfloat16
  wandb_project: null
  init_encoder_from: null
  resume_run_from: null
  encoder_lr_multiplier: 1.0
  use_fused_adamw: true
  show_progress: true

artifacts:
  google_drive_folder_id: null
  hf_model_repo_id: null
  hf_private: true
  sync_on_interrupt: true
  sync_on_completion: true
  hf_publish_selections: []
