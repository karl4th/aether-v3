# AETHER STT v0.1 — phase 1 (CTC branch only) base experiment config.
# Every field here has a dataclass default in src/aether_v3/config.py;
# this file exists so it's easy to see/edit without reading the code.

mimi:
  pretrained_id: kyutai/mimi
  sampling_rate: 24000
  num_quantizers: 1 # semantic codebook only (index 0 of 32)

aether_speech:
  semantic_vocab_size: 2048
  hidden_size: 768
  num_layers: 8
  num_heads: 12
  ffn_size: 3072
  dropout: 0.1
  rope_theta: 10000.0
  max_position_embeddings: 4096

ctc:
  vocab_size: 257 # 256 UTF-8 byte values + 1 blank
  blank_id: 256

data:
  dataset_id: openslr/librispeech_asr
  fallback_dataset_id: distil-whisper/librispeech_asr
  train_splits: ["clean/train.100", "clean/train.360"]
  # openslr/librispeech_asr's real split keys are unsuffixed ("validation",
  # "test") per config - "validation.clean"/"test.other" etc. don't exist
  # and silently sent every eval-split request through fallback_dataset_id
  # instead (a GeneratorBasedBuilder, much slower and less reliable).
  #
  # Deliberately clean-only: the "other" config packs test/train.500/
  # validation together, so requesting even other/validation forces HF to
  # generate its ~500h, ~148k-utterance train.500 split too (confirmed:
  # ~110-115 min one-time + another ~30GB download) just to reach a few
  # thousand eval examples. Not worth it for phase 1 - revisit dev-other/
  # test-other later via a source that doesn't bundle train.500 with it.
  validation_splits: ["clean/validation"]
  test_splits: ["clean/test"]
  cache_dir: data_cache/ctc_base
  sample_rate_in: 16000
  sample_rate_out: 24000
  min_audio_seconds: 0.5
  max_audio_seconds: 20.0
  # 64 OOM'd on a T4 (14.56GB) once a batch happened to include several
  # near-max-length (20s) clips - back to the known-safe value. Don't bump
  # this again without also capping how long the longest clip in a batch
  # can be, or padding to the batch max can blow past VRAM unpredictably.
  extraction_batch_size: 32
  extraction_num_workers: 8 # bump toward Colab's CPU core count if it has more

train:
  output_dir: runs/ctc_base
  batch_size: 32
  grad_accum_steps: 1
  max_steps: 200000
  warmup_steps: 2000
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.98
  grad_clip_norm: 1.0
  eval_interval: 2000
  save_interval: 2000
  log_interval: 50
  num_workers: 4
  seed: 1337
  amp_dtype: bfloat16
  wandb_project: null
  resume_from: null
