# Tiny smoke-test config: hf-internal-testing/librispeech_asr_dummy (a
# handful of utterances) instead of full LibriSpeech, and a short training
# run. Used to validate the whole pipeline end-to-end (resample -> Mimi
# encode -> byte-encode -> cache -> train -> decode) before committing to a
# real LibriSpeech download/run. Not meant to produce a usable model.

mimi:
  pretrained_id: kyutai/mimi
  sampling_rate: 24000
  num_quantizers: 1

aether_speech:
  semantic_vocab_size: 2048
  hidden_size: 768
  num_layers: 8
  num_heads: 12
  ffn_size: 3072
  dropout: 0.1
  rope_theta: 10000.0
  max_position_embeddings: 4096
  streaming_left_context_frames: 256

ctc:
  vocab_size: 257
  blank_id: 256
  upsample_factor: 4
  upsampler_num_layers: 2
  upsampler_num_heads: 12
  upsampler_ffn_size: 3072
  upsampler_dropout: 0.1
  upsampler_rope_theta: 10000.0

semantic_prediction:
  enabled: true
  weight: 0.25
  future_horizons: [1, 2, 4]

data:
  dataset_id: hf-internal-testing/librispeech_asr_dummy
  fallback_dataset_id: null
  train_splits: ["clean/validation"]
  validation_splits: ["clean/validation"]
  test_splits: ["clean/validation"]
  cache_dir: data_cache/ctc_dummy
  sample_rate_in: 16000
  sample_rate_out: 24000
  min_audio_seconds: 0.1
  max_audio_seconds: 30.0
  extraction_batch_size: 8
  extraction_num_workers: 0 # dataset is 73 examples, not worth process overhead

train:
  runs_dir: runs
  run_name: stage1-dummy
  run_id: null
  batch_size: 4
  grad_accum_steps: 1
  max_steps: 300
  warmup_steps: 20
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.98
  grad_clip_norm: 1.0
  eval_interval: 50
  save_interval: 300
  log_interval: 10
  num_workers: 0
  seed: 1337
  amp_dtype: bfloat16
  wandb_project: null
  init_encoder_from: null
  resume_run_from: null
  encoder_lr_multiplier: 1.0
  use_fused_adamw: true
  show_progress: true

artifacts:
  google_drive_folder_id: null
  hf_model_repo_id: null
  hf_private: true
  sync_on_interrupt: true
  sync_on_completion: true
  hf_publish_selections: []
