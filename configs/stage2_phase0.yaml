connector:
  resampler:
    enabled: false
    ratio: 1
    num_heads: 12
    ffn_size: 3072
    dropout: 0.0
    conv_kernel: 5
  bridge:
    input_dim: 768
    intermediate_dim: 3072
    output_dim: 1024
    dropout: 0.0
    init_output_scale: 1.0
llm:
  model_id: Qwen/Qwen3-0.6B
  revision: main
  frozen: true
  dtype: bfloat16
stage2_data:
  dataset_id: karl4th/limmim
  dataset_config: default
  train_split: train
  validation_split: validation
  test_split: test
  task: transcription
  cache_dir: data_cache/stage2_phase0
stage2_train:
  drive_root: /content/drive/MyDrive/aether-v3/stage2
  batch_size: 2
  grad_accum_steps: 1
  max_steps: 100
  warmup_steps: 10
  lr: 1.0e-4
  log_interval: 10
  eval_interval: 100
  eval_steps: [0, 100]
  save_interval: 50
  eval_max_examples: 8
  generation_max_new_tokens: 16
  num_workers: 0
  stage1_repo_id: manifestro/aetherASR-EN-v0.1
  stage1_filename: last.pt
