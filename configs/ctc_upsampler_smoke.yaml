# Smoke-test config for the CTC-upsampler fix (see
# src/aether_v3/models/ctc_upsampler.py and notebooks/ctc_upsampler_experiment.ipynb).
#
# Identical to ctc_base.yaml except `train:` (short run, separate
# run_name so it never collides with the old baseline's checkpoints/
# logs) - `data.cache_dir` is deliberately the SAME as ctc_base.yaml so
# the (expensive, one-time) re-extraction this notebook triggers also
# becomes the cache the full 200k-step run in ctc_base.yaml will use.

mimi:
  pretrained_id: kyutai/mimi
  sampling_rate: 24000
  num_quantizers: 1

aether_speech:
  semantic_vocab_size: 2048
  hidden_size: 768
  num_layers: 8
  num_heads: 12
  ffn_size: 3072
  dropout: 0.1
  rope_theta: 10000.0
  max_position_embeddings: 4096
  streaming_left_context_frames: 256

ctc:
  vocab_size: 257
  blank_id: 256
  upsample_factor: 4
  upsampler_num_layers: 2
  upsampler_num_heads: 12
  upsampler_ffn_size: 3072
  upsampler_dropout: 0.1
  upsampler_rope_theta: 10000.0

semantic_prediction:
  enabled: true
  weight: 0.25
  future_horizons: [1, 2, 4]

data:
  dataset_id: openslr/librispeech_asr
  fallback_dataset_id: distil-whisper/librispeech_asr
  train_splits: ["clean/train.100", "clean/train.360"]
  validation_splits: ["clean/validation"]
  test_splits: ["clean/test"]
  cache_dir: data_cache/ctc_base # same cache_dir as ctc_base.yaml - see note above
  sample_rate_in: 16000
  sample_rate_out: 24000
  min_audio_seconds: 0.5
  max_audio_seconds: 20.0
  extraction_batch_size: 64
  extraction_num_workers: 8

train:
  runs_dir: runs
  run_name: stage1-upsampler-smoke
  run_id: null
  batch_size: 32
  grad_accum_steps: 1
  max_steps: 8000
  warmup_steps: 200
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.98
  grad_clip_norm: 1.0
  eval_interval: 1000
  save_interval: 2000
  log_interval: 25
  num_workers: 4
  seed: 1337
  amp_dtype: bfloat16
  wandb_project: null
  init_encoder_from: null
  resume_run_from: null
  encoder_lr_multiplier: 1.0
  use_fused_adamw: true
  show_progress: true

artifacts:
  google_drive_folder_id: null
  hf_model_repo_id: null
  hf_private: true
  sync_on_interrupt: true
  sync_on_completion: true
  hf_publish_selections: []
