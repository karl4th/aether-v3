connector:
  resampler:
    enabled: false
    ratio: 1
    num_heads: 12
    ffn_size: 3072
    dropout: 0.1
    conv_kernel: 5
  bridge:
    input_dim: 768
    intermediate_dim: 3072
    output_dim: 2560
    dropout: 0.1
    init_output_scale: 1.0
llm:
  model_id: Qwen/Qwen3-4B
  revision: main
  frozen: true
  dtype: bfloat16
stage2_data:
  dataset_id: asapp/slue-phase-2
  dataset_config: sqa5
  train_split: train
  validation_split: validation
  test_split: test
  task: spoken_question_text_document_qa
  cache_dir: data_cache/stage2
stage2_train:
  drive_root: /content/drive/MyDrive/aether-v2/stage2
  batch_size: 1
  grad_accum_steps: 16
  max_steps: 5000
  warmup_steps: 200
  lr: 1.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.01
  grad_clip_norm: 1.0
  log_interval: 10
  eval_interval: 250
  save_interval: 250
  eval_max_examples: 64
  generation_max_new_tokens: 64
  num_workers: 2
  seed: 1337
  amp_dtype: bfloat16
  stage1_repo_id: manifestro/aetherASR-EN-v0.1
  stage1_filename: last.pt
