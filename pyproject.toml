[project]
name = "aether-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bagzhan", email = "bagzhankarl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.17",
    # <4.0: 4.0+ requires torchcodec (and its own ffmpeg shared libs) to
    # decode the Audio feature; pinning below that keeps decoding on
    # soundfile so this doesn't need a system ffmpeg install anywhere.
    "datasets>=2.19,<4.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "jiwer>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
aether-v3 = "aether_v3:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
