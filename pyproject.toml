[project]
name = "aether-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bagzhan", email = "bagzhankarl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.53",
    "datasets>=2.19",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
aether-v3 = "aether_v3:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
